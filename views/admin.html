<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị - Cửa Hàng Cà Phê</title>
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="../public/css/admin.css">
</head>
<body>
    <header>
        <h1>⚙️ Dashboard Quản Trị</h1>
        <a href="/" class="btn-back">← Quay lại Shop</a>
    </header>

    <main class="admin-container">
        <div class="stats">
            <div class="stat-card">
                <h3>Tổng Sản Phẩm</h3>
                <p id="totalProducts">0</p>
            </div>
            <div class="stat-card">
                <h3>Còn Hàng</h3>
                <p id="inStock">0</p>
            </div>
            <div class="stat-card">
                <h3>Hết Hàng</h3>
                <p id="outOfStock">0</p>
            </div>
        </div>

        <section class="form-section">
            <h2>Thêm/Sửa Sản Phẩm</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                
                <div class="form-group">
                    <label>Tên Sản Phẩm *</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label>Giá (VND) *</label>
                    <input type="number" id="price" required min="1">
                </div>

                <div class="form-group">
                    <label>Mô Tả</label>
                    <textarea id="description" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label>URL Hình Ảnh</label>
                    <input type="url" id="image_url">
                </div>

                <div class="form-group">
                    <label>Danh Mục *</label>
                    <select id="category_id" required></select>
                </div>

                <div class="form-group">
                    <label>Trạng Thái</label>
                    <select id="status">
                        <option value="Còn hàng">Còn hàng</option>
                        <option value="Hết hàng">Hết hàng</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">💾 Lưu</button>
                    <button type="reset" class="btn-secondary">🔄 Xóa</button>
                </div>
            </form>
        </section>

        <section class="table-section">
            <h2>Danh Sách Sản Phẩm</h2>
            <table id="productsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên</th>
                        <th>Giá</th>
                        <th>Danh Mục</th>
                        <th>Trạng Thái</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows loaded by JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Cửa Hàng Cà Phê. Tất cả quyền được bảo lưu.</p>
    </footer>

    <script src="../public/js/admin.js"></script>
</body>
</html>
