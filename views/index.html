<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Cà Phê - Sản Phẩm</title>
    <link rel="stylesheet" href="../public/css/style.css">
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 20px; flex: 1;">
            <h1>☕ Cửa Hàng Cà Phê</h1>
            <button id="cartBtn" class="btn-cart">🛒 Giỏ Hàng (<span id="cartCount">0</span>)</button>
        </div>
        <a href="/admin" class="btn-admin">🔧 Quản Trị</a>
    </header>

    <main>
        <div class="filters">
            <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm...">
            <select id="categoryFilter">
                <option value="">-- Tất cả danh mục --</option>
            </select>
        </div>

        <div class="products-grid" id="productsContainer">
            <!-- Products loaded by JavaScript -->
        </div>
    </main>

    <!-- Modal Giỏ Hàng -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🛒 Giỏ Hàng Của Bạn</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <table id="cartTable" class="cart-table">
                    <thead>
                        <tr>
                            <th>Sản Phẩm</th>
                            <th>Giá</th>
                            <th>Số Lượng</th>
                            <th>Thành Tiền</th>
                            <th>Hành Động</th>
                        </tr>
                    </thead>
                    <tbody id="cartItems">
                        <!-- Cart items here -->
                    </tbody>
                </table>
                <div id="emptyCart" style="text-align: center; padding: 40px; color: #999;">
                    <p>Giỏ hàng của bạn trống</p>
                </div>
            </div>
            <div class="modal-footer">
                <div class="cart-summary">
                    <h3>Tổng Tiền: <span id="totalPrice">0</span> VND</h3>
                </div>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="closeCart()">Tiếp Tục Mua Sắm</button>
                    <button class="btn-primary" onclick="checkout()" id="checkoutBtn">💳 Thanh Toán</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Thanh Toán -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💳 Thanh Toán</h2>
                <span class="close" onclick="closeCheckout()">&times;</span>
            </div>
            <form id="checkoutForm" class="checkout-form">
                <div class="form-group">
                    <label>Họ Và Tên *</label>
                    <input type="text" id="customerName" required>
                </div>
                <div class="form-group">
                    <label>Số Điện Thoại *</label>
                    <input type="tel" id="customerPhone" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="customerEmail">
                </div>
                <div class="form-group">
                    <label>Địa Chỉ *</label>
                    <textarea id="customerAddress" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Ghi Chú</label>
                    <textarea id="customerNote" rows="2"></textarea>
                </div>
                <div style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin: 15px 0;">
                    <h3>Thống Kê Đơn Hàng:</h3>
                    <p>Số sản phẩm: <strong id="orderCount">0</strong></p>
                    <p>Tổng tiền: <strong id="orderTotal">0</strong> VND</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn-secondary" onclick="closeCheckout()">Hủy</button>
                    <button type="submit" class="btn-primary">✅ Xác Nhận Đơn Hàng</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Cửa Hàng Cà Phê. Tất cả quyền được bảo lưu.</p>
    </footer>

    <script src="../public/js/customer.js"></script>
</body>
</html>
