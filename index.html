<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☕ Cửa Hàng Cà Phê - Quản Lý Sản Phẩm</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">☕ Coffee Shop</h1>
            <div class="nav-links">
                <button id="btnCustomer" class="nav-btn active">🏠 Khách Hàng</button>
                <button id="btnAdmin" class="nav-btn">⚙️ Quản Trị</button>
            </div>
        </div>
    </nav>

    <!-- ==================== PHẦN KHÁCH HÀNG ==================== -->
    <section id="customerSection" class="section active">
        <div class="container">
            <h2>🛍️ Danh Sách Sản Phẩm</h2>
            
            <!-- Filters -->
            <div class="filters">
                <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm sản phẩm...">
                <select id="categoryFilter">
                    <option value="">📦 Tất cả danh mục</option>
                    <option value="1">☕ Cà phê pha máy</option>
                    <option value="2">☕ Cà phê truyền thống</option>
                    <option value="3">🍵 Trà trái cây</option>
                </select>
            </div>

            <!-- Products Grid -->
            <div class="products-grid" id="productsGrid">
                <!-- Sản phẩm sẽ được thêm bằng JavaScript -->
            </div>
        </div>
    </section>

    <!-- ==================== PHẦN QUẢN TRỊ ==================== -->
    <section id="adminSection" class="section">
        <div class="container">
            <h2>⚙️ Dashboard Quản Trị</h2>

            <!-- Statistics -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>📊 Tổng Sản Phẩm</h3>
                    <p id="totalProducts" class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>✅ Còn Hàng</h3>
                    <p id="inStockCount" class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>❌ Hết Hàng</h3>
                    <p id="outOfStockCount" class="stat-number">0</p>
                </div>
            </div>

            <!-- Form Thêm/Sửa -->
            <div class="form-section">
                <h3>➕ Thêm / Sửa Sản Phẩm</h3>
                <form id="productForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tên Sản Phẩm *</label>
                            <input type="text" id="productName" required>
                        </div>
                        <div class="form-group">
                            <label>Giá (VND) *</label>
                            <input type="number" id="productPrice" required min="1">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Danh Mục *</label>
                            <select id="productCategory" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option value="1">☕ Cà phê pha máy</option>
                                <option value="2">☕ Cà phê truyền thống</option>
                                <option value="3">🍵 Trà trái cây</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Trạng Thái</label>
                            <select id="productStatus">
                                <option value="Còn hàng">✅ Còn hàng</option>
                                <option value="Hết hàng">❌ Hết hàng</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label>Mô Tả</label>
                        <textarea id="productDescription" rows="3"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label>URL Hình Ảnh</label>
                        <input type="url" id="productImage">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">💾 Lưu</button>
                        <button type="reset" class="btn-secondary">🔄 Xóa</button>
                        <button type="button" id="btnCancelEdit" class="btn-secondary" style="display:none;">❌ Hủy</button>
                    </div>
                </form>
            </div>

            <!-- Bảng Sản Phẩm -->
            <div class="table-section">
                <h3>📋 Danh Sách Sản Phẩm</h3>
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên</th>
                            <th>Giá</th>
                            <th>Danh Mục</th>
                            <th>Trạng Thái</th>
                            <th>Hành Động</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductsTable">
                        <!-- Sản phẩm sẽ được thêm bằng JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Cửa Hàng Cà Phê - Bài Tập Công Nghệ Phần Mềm</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
